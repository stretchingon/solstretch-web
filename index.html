    function App() {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedZone, setSelectedZone] = useState(BODY_ZONES[0]);
      const [toastMessage, setToastMessage] = useState(null);

      const getNextWorkingDateStr = () => {
        const d = new Date();
        d.setDate(d.getDate() + 1);
        if (d.getDay() === 0) {
          d.setDate(d.getDate() + 1);
        }
        return d.toISOString().split('T')[0];
      };

      const [bookingStep, setBookingStep] = useState(1);
      const [selectedProgram, setSelectedProgram] = useState(PROGRAMS[0]);
      const [selectedDate, setSelectedDate] = useState(getNextWorkingDateStr);
      const [selectedTime, setSelectedTime] = useState(TIME_SLOTS[2]);
      
      const [userName, setUserName] = useState('');
      const [userPhone, setUserPhone] = useState('');
      const [userNote, setUserNote] = useState('');
      const [privacyAgreed, setPrivacyAgreed] = useState(false);

      const [allBookings, setAllBookings] = useState(getInitialBookings);
      const [adminPin, setAdminPin] = useState(getInitialAdminPin);
      const [newAdminPinInput, setNewAdminPinInput] = useState('');
      const [showPinChangeForm, setShowPinChangeForm] = useState(false);

      const [adminViewMode, setAdminViewMode] = useState('calendar');
      const [currentCalYear, setCurrentCalYear] = useState(new Date().getFullYear());
      const [currentCalMonth, setCurrentCalMonth] = useState(new Date().getMonth());

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(allBookings));
        } catch (e) {}
      }, [allBookings]);

      useEffect(() => {
        try {
          localStorage.setItem(ADMIN_PIN_KEY, adminPin);
        } catch (e) {}
      }, [adminPin]);

      const [activeModal, setActiveModal] = useState(null);
      const [lastConfirmedBooking, setLastConfirmedBooking] = useState(null);
      const [openFaq, setOpenFaq] = useState(null);

      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [adminPinInput, setAdminPinInput] = useState('');
      const [adminSearchQuery, setAdminSearchQuery] = useState('');
      const [adminDateFilter, setAdminDateFilter] = useState('');
      
      const [manualName, setManualName] = useState('');
      const [manualPhone, setManualPhone] = useState('');
      const [manualProgram, setManualProgram] = useState(PROGRAMS[0]);
      const [manualDate, setManualDate] = useState(getNextWorkingDateStr);
      const [manualTime, setManualTime] = useState(TIME_SLOTS[0]);
      const [manualNote, setManualNote] = useState('전화 예약 (원장 수기)');

      const [academyName, setAcademyName] = useState('');
      const [academyPhone, setAcademyPhone] = useState('');
      const [academyNote, setAcademyNote] = useState('');

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => { setToastMessage(null); }, 4000);
      };

      const scrollToSection = (id) => {
        setMobileMenuOpen(false);
        const element = document.getElementById(id);
        if (element) {
          element.scrollIntoView({ behavior: 'smooth' });
        }
      };

      const isSundayDate = (dateStr) => {
        if (!dateStr) return false;
        const d = new Date(dateStr + 'T00:00:00');
        return d.getDay() === 0;
      };

      const getBookedTimesForDate = (dateStr) => {
        return allBookings
          .filter(b => b.date === dateStr && b.status !== '취소')
          .map(b => b.time);
      };

      const currentBookedTimes = getBookedTimesForDate(selectedDate);

      const handleSelectProgramAndBook = (programId) => {
        const prog = PROGRAMS.find(p => p.id === programId) || PROGRAMS[0];
        setSelectedProgram(prog);
        setBookingStep(2);
        scrollToSection('reservation');
      };

      const handleConfirmBooking = async (e) => {
        e.preventDefault();
        if (!privacyAgreed) {
          showToast('개인정보 수집 및 이용 동의에 동의해 주세요.');
          return;
        }
        if (!userName.trim() || !userPhone.trim()) {
          showToast('성함과 연락처를 빠짐없이 입력해 주세요.');
          return;
        }

        if (isSundayDate(selectedDate)) {
          showToast('일요일은 정기 휴무일입니다. 다른 날짜를 선택해 주세요.');
          return;
        }

        const isAlreadyBooked = currentBookedTimes.includes(selectedTime);
        if (isAlreadyBooked) {
          showToast(`이미 ${selectedDate} ${selectedTime} 시간대는 예약이 마감되었습니다. 다른 시간대를 선택해 주세요.`);
          return;
        }

        const bookingId = 'SOL-' + Math.floor(100000 + Math.random() * 900000);
        const newBookingData = {
          id: bookingId,
          programId: selectedProgram.id,
          programTitle: selectedProgram.title,
          duration: selectedProgram.duration,
          price: selectedProgram.price,
          date: selectedDate,
          time: selectedTime,
          name: userName.trim(),
          phone: userPhone.trim(),
          note: userNote.trim(),
          status: '예약 확정',
          createdAt: new Date().toLocaleDateString('ko-KR') + ' ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
        };

        setAllBookings(prev => [newBookingData, ...prev]);
        setLastConfirmedBooking(newBookingData);
        setActiveModal('booking-success');

        try {
          fetch('/api/send-alimtalk', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newBookingData)
          }).catch(err => console.error('Solapi notification trigger error:', err));
        } catch (err) {
          console.error(err);
        }
        
        setUserName('');
        setUserPhone('');
        setUserNote('');
        setPrivacyAgreed(false);
      };

      const isEligibleForUserCancel = (booking) => {
        try {
          if (booking.status === '취소') return false;
          const apptTime = new Date(`${booking.date}T${booking.time}:00`);
          const now = new Date();
          const diffInHours = (apptTime - now) / (1000 * 60 * 60);
          return diffInHours >= 3;
        } catch (e) {
          return false;
        }
      };

      const handleUserCancelBooking = (booking) => {
        if (!isEligibleForUserCancel(booking)) {
          showToast('방문시간 3시간 이내의 예약은 대표 전화(010-6566-6369)로만 취소 가능합니다.');
          return;
        }

        setAllBookings(prev => prev.map(b => b.id === booking.id ? { ...b, status: '취소' } : b));
        showToast(`예약번호 [${booking.id}] 예약이 취소 처리되었습니다.`);
      };

      const handleAdminManualBooking = (e) => {
        e.preventDefault();
        if (!manualName.trim() || !manualPhone.trim()) {
          showToast('고객 성함과 연락처를 입력해 주세요.');
          return;
        }

        if (isSundayDate(manualDate)) {
          showToast('일요일은 정기 휴무일입니다. 다른 날짜를 선택해 주세요.');
          return;
        }

        const bookedTimes = getBookedTimesForDate(manualDate);
        if (bookedTimes.includes(manualTime)) {
          showToast(`[알림] ${manualDate} ${manualTime}은 이미 다른 예약이 존재합니다.`);
          return;
        }

        const newManualBooking = {
          id: 'DIR-' + Math.floor(100000 + Math.random() * 900000),
          programId: manualProgram.id,
          programTitle: manualProgram.title,
          duration: manualProgram.duration,
          price: manualProgram.price,
          date: manualDate,
          time: manualTime,
          name: manualName.trim(),
          phone: manualPhone.trim(),
          note: manualNote.trim(),
          status: '예약 확정 (원장 직접)',
          createdAt: new Date().toLocaleDateString('ko-KR')
        };

        setAllBookings(prev => [newManualBooking, ...prev]);
        showToast(`${manualName}님 전화예약시간(${manualDate} ${manualTime})이 성공적으로 잠금 마감되었습니다.`);
        setManualName('');
        setManualPhone('');
      };

      const handleDeleteBooking = (bookingToDelete) => {
        setAllBookings(prev => prev.filter(b => b.id !== bookingToDelete.id));
        showToast(`예약번호 [${bookingToDelete.id}] 예약 정보가 삭제 처리되었습니다.`);
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPinInput === adminPin) {
          setIsAdminAuthenticated(true);
          setActiveModal('admin-dashboard');
          setAdminPinInput('');
          showToast('원장님 관리자 모드로 로그인되었습니다.');
        } else {
          showToast('비밀번호가 올바르지 않습니다.');
        }
      };

      const handleChangeAdminPin = (e) => {
        e.preventDefault();
        if (!newAdminPinInput.trim() || newAdminPinInput.trim().length < 4) {
          showToast('새 비밀번호는 최소 4자리 이상 입력해 주세요.');
          return;
        }
        setAdminPin(newAdminPinInput.trim());
        showToast(`관리자 비밀번호가 성공적으로 변경되었습니다.`);
        setNewAdminPinInput('');
        setShowPinChangeForm(false);
      };

      const handleAcademySubmit = (e) => {
        e.preventDefault();
        if (!academyName.trim() || !academyPhone.trim()) {
          showToast('성함과 연락처를 입력해 주세요.');
          return;

        setAcademyName('');
        setAcademyPhone('');
        setAcademyNote('');
        setActiveModal(null);
      };

      const openMapSearch = (type) => {
        const query = "스트레칭 온";
        if (type === 'naver') {
          window.open(`https://map.naver.com/p/search/${encodeURIComponent(query)}`, '_blank');
        } else if (type === 'kakao') {
          window.open(`https://map.kakao.com/link/search/${encodeURIComponent(query)}`, '_blank');
        }
      };

      const renderAdminMonthlyCalendar = () => {
        const firstDayOfMonth = new Date(currentCalYear, currentCalMonth, 1);
        const startingDayOfWeek = firstDayOfMonth.getDay();
        const daysInMonth = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();

        const monthName = `${currentCalYear}년 ${currentCalMonth + 1}월`;

        const prevMonth = () => {
          if (currentCalMonth === 0) {
            setCurrentCalYear(currentCalYear - 1);
            setCurrentCalMonth(11);
          } else {
            setCurrentCalMonth(currentCalMonth - 1);
          }
        };

        const nextMonth = () => {
          if (currentCalMonth === 11) {
            setCurrentCalYear(currentCalYear + 1);
            setCurrentCalMonth(0);
          } else {
            setCurrentCalMonth(currentCalMonth + 1);
          }
        };

        const calendarCells = [];
        for (let i = 0; i < startingDayOfWeek; i++) {
          calendarCells.push(<div key={`empty-${i}`} className="h-24 bg-stone-50/50 border border-stone-100 p-1.5 opacity-40"></div>);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const mStr = String(currentCalMonth + 1).padStart(2, '0');
          const dStr = String(day).padStart(2, '0');
          const dateString = `${currentCalYear}-${mStr}-${dStr}`;

          const isSun = new Date(currentCalYear, currentCalMonth, day).getDay() === 0;
          const dayBookings = allBookings.filter(b => b.date === dateString && b.status !== '취소');

          const isSelectedFilter = adminDateFilter === dateString;

          calendarCells.push(
            <div 
              key={dateString}
              onClick={() => setAdminDateFilter(isSelectedFilter ? '' : dateString)}
              className={`h-24 border p-2 rounded-xl cursor-pointer transition-all flex flex-col justify-between ${
                isSelectedFilter 
                  ? 'bg-sky-50 border-sky-400 ring-2 ring-sky-300' 
                  : isSun 
                    ? 'bg-rose-50/40 border-stone-200/80 hover:bg-rose-50' 
                    : 'bg-white border-stone-200 hover:bg-stone-50'
              }`}
            >
              <div className="flex justify-between items-center">
                <span className={`text-xs font-semibold ${isSun ? 'text-rose-600' : 'text-[#0C3559]'}`}>
                  {day}일 {isSun && <span className="text-[10px] font-normal text-rose-500">(휴무)</span>}
                </span>
                {dayBookings.length > 0 && (
                  <span className="px-2 py-0.5 rounded-full bg-[#0C3559] text-white text-[10px] font-bold">
                    {dayBookings.length}건
                  </span>
                )}
              </div>

              <div className="space-y-1 overflow-hidden">
                {dayBookings.slice(0, 2).map((b, idx) => (
                  <div key={idx} className="text-[10px] bg-sky-100 text-[#0C3559] px-1.5 py-0.5 rounded truncate font-medium">
                    {b.time} {b.name}
                  </div>
                ))}
                {dayBookings.length > 2 && (
                  <p className="text-[9px] text-[#0092B8] font-semibold text-right">+{dayBookings.length - 2}건 더보기</p>
                )}
              </div>
            </div>
          );
        }

        return (
          <div className="space-y-4">
            <div className="flex items-center justify-between bg-stone-100 p-3 rounded-2xl">
              <button onClick={prevMonth} className="p-2 rounded-xl bg-white shadow-sm hover:bg-stone-50 text-[#0C3559]">
                <IconChevronLeft className="w-4 h-4" />
              </button>
              <h4 className="text-base font-bold text-[#0C3559] font-mono">{monthName} 예약 스케줄</h4>
              <button onClick={nextMonth} className="p-2 rounded-xl bg-white shadow-sm hover:bg-stone-50 text-[#0C3559]">
                <IconChevronRight className="w-4 h-4" />
              </button>
            </div>

            <div className="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-[#0C3559]/70 border-b pb-2">
              <div className="text-rose-600">일 (휴무)</div>
              <div>월</div>
              <div>화</div>
              <div>수</div>
              <div>목</div>
              <div>금</div>
              <div>토</div>
            </div>

            <div className="grid grid-cols-7 gap-1.5">
              {calendarCells}
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-[#FAF9F6] text-[#0C3559]">
          
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#0C3559] text-white px-6 py-4 rounded-2xl shadow-2xl border border-sky-400/30 flex items-center gap-3 animate-bounce">
              <IconSparkles className="w-5 h-5 text-sky-400 shrink-0" />
              <span className="text-xs sm:text-sm font-semibold">{toastMessage}</span>
            </div>
          )}

          {/* Header Navigation */}
          <header className="fixed top-0 left-0 right-0 z-40 bg-white/85 backdrop-blur-2xl border-b border-stone-200/80 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">

                  <div>
                    <h3 className="text-2xl font-semibold text-[#0C3559]">원장님 전용 실시간 예약 대시보드</h3>
                    <p className="text-xs text-stone-500 mt-1">총 등록 예약: {allBookings.filter(b => b.status !== '취소').length}건</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => setAdminViewMode(adminViewMode === 'calendar' ? 'list' : 'calendar')} className="px-3.5 py-1.5 bg-[#0C3559] text-white rounded-xl text-xs font-semibold">
                      {adminViewMode === 'calendar' ? '📋 목록 보기' : '📅 월별 달력 보기'}
                    </button>
                    <button onClick={() => setShowPinChangeForm(!showPinChangeForm)} className="px-3 py-1.5 bg-amber-100 text-amber-900 rounded-xl text-xs font-semibold">🔑 비밀번호 변경</button>
                  </div>
                </div>

                {showPinChangeForm && (
                  <form onSubmit={handleChangeAdminPin} className="p-4 bg-amber-50 rounded-xl mb-4 flex gap-2">
                    <input type="password" required placeholder="새 비밀번호 입력" value={newAdminPinInput} onChange={(e) => setNewAdminPinInput(e.target.value)} className="border p-2 rounded text-xs w-full" />
                    <button type="submit" className="px-4 py-2 bg-amber-800 text-white rounded text-xs font-semibold shrink-0">저장</button>
                  </form>
                )}

                {/* Direct Manual Phone Booking Form */}
                <div className="p-4 rounded-2xl bg-amber-50 mb-6 space-y-3">
                  <h4 className="text-sm font-semibold text-amber-950">전화 예약 수기 직접 등록 (타임 마감)</h4>
                  <form onSubmit={handleAdminManualBooking} className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    <input type="text" placeholder="성함 *" value={manualName} onChange={(e) => setManualName(e.target.value)} className="border p-2 rounded text-xs" required />
                    <input type="tel" placeholder="연락처 *" value={manualPhone} onChange={(e) => setManualPhone(e.target.value)} className="border p-2 rounded text-xs" required />
                    <input 
                      type="date" 
                      value={manualDate} 
                      onChange={(e) => {
                        if (isSundayDate(e.target.value)) {
                          showToast('일요일은 휴무입니다. 평일/토요일을 선택해 주세요.');
                          return;
                        }
                        setManualDate(e.target.value);
                      }} 
                      className="border p-2 rounded text-xs" 
                      required 
                    />
                    <select value={manualTime} onChange={(e) => setManualTime(e.target.value)} className="border p-2 rounded text-xs">
                      {TIME_SLOTS.map(t => <option key={t} value={t}>{t}</option>)}
                    </select>
                    <select value={manualProgram.id} onChange={(e) => setManualProgram(PROGRAMS.find(p => p.id === e.target.value))} className="border p-2 rounded text-xs">
                      {PROGRAMS.map(p => <option key={p.id} value={p.id}>{p.title}</option>)}
                    </select>
                    <button type="submit" className="py-2 bg-amber-800 text-white rounded text-xs font-semibold">전화예약 수기 등록</button>
                  </form>
                </div>

                {/* View Switcher */}
                {adminViewMode === 'calendar' ? (
                  <div className="space-y-6">
                    {renderAdminMonthlyCalendar()}

                    {adminDateFilter && (
                      <div className="p-4 rounded-2xl bg-sky-50 border border-sky-200">
                        <div className="flex justify-between items-center mb-3">
                          <h4 className="font-semibold text-sm text-[#0C3559]">
                            📍 {adminDateFilter} 예약 상세 내역 ({allBookings.filter(b => b.date === adminDateFilter && b.status !== '취소').length}건)
                          </h4>
                          <button onClick={() => setAdminDateFilter('')} className="text-xs text-stone-500 underline">필터 해제</button>
                        </div>

                        {allBookings.filter(b => b.date === adminDateFilter).length === 0 ? (
                          <p className="text-xs text-stone-500 py-4 text-center">해당 날짜에 등록된 예약이 없습니다.</p>
                        ) : (
                          <div className="space-y-2">
                            {allBookings.filter(b => b.date === adminDateFilter).map(b => (
                              <div key={b.id} className="p-3 rounded-xl bg-white border flex justify-between items-center text-xs">
                                <div>
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold mr-2 ${b.status === '취소' ? 'bg-stone-200 text-stone-600' : 'bg-emerald-100 text-emerald-800'}`}>{b.status}</span>
                                  <strong className="text-[#0092B8] mr-2">{b.time}</strong>
                                  <span className="font-semibold text-[#0C3559]">{b.name}님 ({b.phone})</span>
                                  <span className="text-stone-400 ml-2">[{b.programTitle}]</span>
                                </div>
                                <button onClick={() => handleDeleteBooking(b)} className="px-2.5 py-1 bg-red-50 text-red-600 rounded text-[11px]">삭제</button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="space-y-3">
                    <div className="flex justify-between items-center gap-2 mb-2">
                      <input type="text" placeholder="이름/연락처 검색" value={adminSearchQuery} onChange={(e) => setAdminSearchQuery(e.target.value)} className="border rounded-xl px-3 py-1.5 text-xs w-full sm:w-64" />
                      <input type="date" value={adminDateFilter} onChange={(e) => setAdminDateFilter(e.target.value)} className="border rounded-xl px-3 py-1.5 text-xs" />
                    </div>

                    {allBookings
                      .filter(b => {
                        const matchSearch = (b.name || '').includes(adminSearchQuery) || (b.phone || '').includes(adminSearchQuery);
                        const matchDate = adminDateFilter ? b.date === adminDateFilter : true;
                        return matchSearch && matchDate;
                      })
                      .map(b => (
                        <div key={b.id} className="p-3.5 rounded-xl bg-stone-50 border flex justify-between items-center text-xs">
                          <div>
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold mr-2 ${b.status === '취소' ? 'bg-stone-200 text-stone-600' : 'bg-emerald-100 text-emerald-800'}`}>{b.status}</span>
                            <p className="font-semibold text-[#0C3559] inline-block">{b.name}님 ({b.phone})</p>
                            <p className="text-stone-500 mt-0.5">{b.programTitle} | <strong className="text-[#0092B8]">{b.date} {b.time}</strong></p>
                          </div>
                          <button onClick={() => handleDeleteBooking(b)} className="px-3 py-1.5 bg-red-50 text-red-600 rounded-lg text-[11px] font-semibold shrink-0">삭제</button>
                        </div>
                      ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {activeModal === 'academy-apply' && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-8 relative">
                <button onClick={() => setActiveModal(null)} className="absolute top-6 right-6 p-2 text-stone-500"><IconX /></button>
                <h3 className="text-2xl font-semibold text-[#0C3559] mb-4">지도자 교육 수강 상담 신청</h3>
                <form onSubmit={handleAcademySubmit} className="space-y-3">
                  <input type="text" required placeholder="성함 *" value={academyName} onChange={(e) => setAcademyName(e.target.value)} className="w-full border p-3 rounded-xl text-sm" />
                  <input type="tel" required placeholder="연락처 *" value={academyPhone} onChange={(e) => setAcademyPhone(e.target.value)} className="w-full border p-3 rounded-xl text-sm" />
                  <textarea rows={3} placeholder="문의사항" value={academyNote} onChange={(e) => setAcademyNote(e.target.value)} className="w-full border p-3 rounded-xl text-sm resize-none" />
                  <button type="submit" className="w-full py-3.5 bg-[#0C3559] text-white rounded-xl text-sm font-semibold">상담 신청하기</button>
                </form>
              </div>
            </div>
          )}

          {/* Client My Bookings View Modal */}
          {activeModal === 'my-bookings' && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-8 relative max-h-[80vh] overflow-y-auto">
                <button onClick={() => setActiveModal(null)} className="absolute top-6 right-6 p-2 text-stone-500"><IconX /></button>
                <h3 className="text-xl font-semibold text-[#0C3559] mb-2">내 예약 내역 ({allBookings.filter(b => b.status !== '취소').length}건)</h3>
                <p className="text-xs text-stone-500 mb-4">* 방문 3시간 전까지 웹에서 직접 예약을 취소할 수 있습니다.</p>

                {allBookings.length === 0 ? (
                  <p className="text-xs text-stone-500 text-center py-8">등록된 예약 내역이 없습니다.</p>
                ) : (
                  <div className="space-y-3">
                    {allBookings.map(b => {
                      const eligible = isEligibleForUserCancel(b);
                      return (
                        <div key={b.id} className="p-4 rounded-xl bg-stone-50 border flex justify-between items-center text-xs">
                          <div>
                            <div className="flex items-center gap-2 mb-1">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${b.status === '취소' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-800'}`}>
                                {b.status}
                              </span>
                              <span className="font-mono text-stone-400">{b.id}</span>
                            </div>
                            <p className="font-semibold text-[#0C3559]">{b.programTitle}</p>
                            <p className="text-stone-500">{b.date} {b.time} | {b.name}님</p>
                          </div>

                          {b.status !== '취소' && (
                            eligible ? (
                              <button 
                                onClick={() => handleUserCancelBooking(b)} 
                                className="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg font-semibold border border-rose-200 shrink-0"
                              >
                                예약 취소
                              </button>
                            ) : (
                              <span className="text-[10px] text-stone-400 text-right shrink-0">
                                방문 3시간 이내<br />(취소 전화문의)
                              </span>
                            )
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

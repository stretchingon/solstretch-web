<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- PWA 및 모바일 최적화 메타 태그 (앱처럼 보이게 하는 핵심) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a202c">
    <title>Stretching ON - 스트레칭 온</title>
    
    <!-- Tailwind CSS (디자인) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 원장님의 Firebase 설정으로 교체해주세요.
        const firebaseConfig = {
            apiKey: "API_KEY",
            authDomain: "PROJECT_ID.firebaseapp.com",
            projectId: "PROJECT_ID",
            storageBucket: "PROJECT_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- [URL 라우팅 로직] 앱 뷰 모드인지 확인 ---
        const urlParams = new URLSearchParams(window.location.search);
        const isAppView = urlParams.get('view') === 'app';

        document.addEventListener("DOMContentLoaded", () => {
            if (isAppView) {
                // 일반 홈페이지 숨기고 앱 화면 띄우기
                document.getElementById('main-website').style.display = 'none';
                document.getElementById('app-view').style.display = 'block';
            } else {
                // 앱 화면 숨기고 일반 홈페이지 띄우기
                document.getElementById('main-website').style.display = 'block';
                document.getElementById('app-view').style.display = 'none';
            }
        });

        // --- [공통] 10회권 회원 검증 로직 ---
        async function verifyMember(name, phone) {
            const q = query(collection(db, "members"), where("name", "==", name), where("phone", "==", phone));
            const querySnapshot = await getDocs(q);
            
            if (querySnapshot.empty) {
                return { isValid: false, message: "등록된 회원 정보가 없습니다." };
            }
            
            let memberData = null;
            querySnapshot.forEach((doc) => {
                memberData = { id: doc.id, ...doc.data() };
            });

            if (memberData.remaining_sessions <= 0) {
                return { isValid: false, message: "잔여 수강권이 없습니다. 재결제가 필요합니다." };
            }

            return { isValid: true, data: memberData };
        }

        // --- [앱 전용 화면 로직] ---
        window.appLogin = async function() {
            const name = document.getElementById('app-name').value;
            const phone = document.getElementById('app-phone').value;

            if(!name || !phone) {
                alert("성함과 연락처를 입력해주세요.");
                return;
            }

            // 회원 DB 검증
            const verification = await verifyMember(name, phone);
            
            if (!verification.isValid) {
                alert("🚨 " + verification.message);
                return;
            }

            // 로그인 성공 시 화면 전환
            document.getElementById('app-login-screen').style.display = 'none';
            document.getElementById('app-booking-screen').style.display = 'block';
            
            // 회원 정보 표시
            document.getElementById('app-user-name').innerText = verification.data.name;
            document.getElementById('app-sessions-left').innerText = verification.data.remaining_sessions;
            
            // 세션스토리지에 임시 저장 (창 닫으면 증발하여 보안 유지)
            sessionStorage.setItem('currentMemberName', name);
            sessionStorage.setItem('currentMemberPhone', phone);
        }

        window.submitAppBooking = async function() {
            const name = sessionStorage.getItem('currentMemberName');
            const phone = sessionStorage.getItem('currentMemberPhone');
            const date = document.getElementById('app-date').value;
            const time = document.getElementById('app-time').value;

            if(!date || !time) {
                alert("날짜와 시간을 모두 선택해주세요.");
                return;
            }

            try {
                // 예약 DB에 저장 (앱 전용 예약)
                await addDoc(collection(db, "reservations"), {
                    name: name,
                    phone: phone,
                    type: "10회권 (앱예약)",
                    date: date,
                    time: time,
                    createdAt: new Date()
                });
                alert("✅ 1:1 예약이 확정되었습니다!");
                // 폼 초기화
                document.getElementById('app-date').value = '';
                document.getElementById('app-time').value = '';
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("예약 중 오류가 발생했습니다.");
            }
        }

        // --- [일반 홈페이지 로직] 예약 폼 제출 차단 보안 로직 ---
        window.submitWebBooking = async function(e) {
            e.preventDefault();
            const type = document.getElementById('web-type').value;
            const name = document.getElementById('web-name').value;
            const phone = document.getElementById('web-phone').value;
            const date = document.getElementById('web-date').value;
            const time = document.getElementById('web-time').value;

            // 핵심 보안: 10회권을 선택했는데 비회원이거나 횟수가 0인 경우 차단
            if (type === "10회권") {
                const verification = await verifyMember(name, phone);
                if (!verification.isValid) {
                    alert("🚨 10회권 등록 회원이 아니거나 잔여 수강권이 없습니다. 일반 예약을 이용해 주세요.");
                    return; // 예약 전송 원천 차단
                }
            }

            try {
                await addDoc(collection(db, "reservations"), {
                    name: name,
                    phone: phone,
                    type: type,
                    date: date,
                    time: time,
                    createdAt: new Date()
                });
                alert("예약이 완료되었습니다!");
                document.getElementById('web-booking-form').reset();
            } catch (e) {
                console.error("Error adding document: ", e);
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- ========================================== -->
    <!-- 1. 앱 전용 모바일 뷰 (URL에 ?view=app 일때만 표시) -->
    <!-- ========================================== -->
    <div id="app-view" class="hidden min-h-screen bg-gray-100 p-4 max-w-md mx-auto relative shadow-lg">
        
        <!-- 로그인(본인확인) 화면 -->
        <div id="app-login-screen" class="mt-20 bg-white p-6 rounded-2xl shadow">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-blue-900">Stretching ON</h1>
                <p class="text-gray-500 text-sm mt-1">10회권 회원 전용 예약 시스템</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="app-name" placeholder="성함 입력" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
                <input type="tel" id="app-phone" placeholder="연락처 (예: 01012345678)" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
                <button onclick="appLogin()" class="w-full bg-blue-900 text-white font-bold py-3 rounded-lg hover:bg-blue-800 transition">
                    잔여 횟수 확인 및 예약하기
                </button>
            </div>
        </div>

        <!-- 예약 및 내 정보 화면 -->
        <div id="app-booking-screen" class="hidden space-y-6">
            <!-- 회원 프로필 카드 -->
            <div class="bg-gradient-to-r from-blue-900 to-blue-700 p-6 rounded-2xl text-white shadow-md">
                <h2 class="text-xl font-bold"><span id="app-user-name">O</span> 회원님, 반갑습니다!</h2>
                <div class="mt-4 bg-white/20 p-4 rounded-lg flex justify-between items-center">
                    <span class="text-sm font-medium">남은 수강권</span>
                    <span class="text-2xl font-bold"><span id="app-sessions-left" class="text-yellow-300">0</span> / 10회</span>
                </div>
            </div>

            <!-- 간편 예약 카드 -->
            <div class="bg-white p-6 rounded-2xl shadow-md">
                <h3 class="font-bold text-gray-800 mb-4">⏱️ 3초 1:1 예약</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">날짜 선택</label>
                        <input type="date" id="app-date" class="w-full p-3 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">시간 선택</label>
                        <select id="app-time" class="w-full p-3 border rounded-lg">
                            <option value="">시간을 선택하세요</option>
                            <option value="10:00">10:00</option>
                            <option value="13:00">13:00</option>
                            <option value="15:00">15:00</option>
                            <option value="19:00">19:00</option>
                        </select>
                    </div>
                    <button onclick="submitAppBooking()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-lg shadow-lg hover:bg-blue-700 transition mt-2">
                        1:1 예약 확정하기
                    </button>
                </div>
            </div>
            
            <!-- 주의사항 -->
            <p class="text-xs text-center text-gray-400 pb-10">예약 변경 및 취소는 하루 전까지 가능합니다.</p>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- 2. 일반 홈페이지 뷰 (기본 화면) -->
    <!-- ========================================== -->
    <div id="main-website">
        
        <!-- 내비게이션 바 -->
        <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <h1 class="text-xl font-bold text-blue-900 tracking-wider">Stretching ON</h1>
                <ul class="flex space-x-6 text-sm font-medium text-gray-600 hidden md:flex">
                    <li class="hover:text-blue-900 cursor-pointer">브랜드 철학</li>
                    <li class="hover:text-blue-900 cursor-pointer">프로그램</li>
                    <li class="hover:text-blue-900 cursor-pointer">아카데미</li>
                </ul>
                <div class="flex space-x-4">
                    <button class="text-sm font-bold text-gray-600 border border-gray-300 px-3 py-1 rounded hover:bg-gray-100">내 예약 / 조회</button>
                    <button class="bg-blue-900 text-white px-4 py-2 rounded text-sm font-bold hover:bg-blue-800">실시간 예약</button>
                    <button class="text-xs text-gray-400 align-bottom pt-2">[관리자]</button>
                </div>
            </div>
        </nav>

        <!-- 히어로 섹션 -->
        <header class="bg-gray-100 py-20 text-center">
            <h2 class="text-4xl font-extrabold text-gray-800 mb-4">당신의 몸을 깨우는 시간</h2>
            <p class="text-lg text-gray-600 mb-8">전문가의 1:1 맞춤 스트레칭 솔루션을 경험하세요.</p>
        </header>

        <!-- 일반 예약 섹션 (비회원 차단 로직 적용됨) -->
        <section class="max-w-3xl mx-auto py-16 px-4">
            <h3 class="text-2xl font-bold text-center mb-8">온라인 1:1 실시간 예약</h3>
            <form id="web-booking-form" onsubmit="submitWebBooking(event)" class="bg-white p-8 shadow-lg rounded-xl space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold mb-2">성함</label>
                        <input type="text" id="web-name" required class="w-full border p-3 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">연락처</label>
                        <input type="tel" id="web-phone" required class="w-full border p-3 rounded">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">예약 유형 (수강권 선택)</label>
                    <select id="web-type" required class="w-full border p-3 rounded">
                        <option value="일반예약">일반 1회 예약 (체험)</option>
                        <option value="10회권" class="font-bold text-blue-700">★ 10회권 등록 회원 ★</option>
                    </select>
                    <p class="text-xs text-red-500 mt-2">* 10회권은 기존에 등록 및 결제를 완료한 회원만 선택 가능합니다.</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold mb-2">날짜</label>
                        <input type="date" id="web-date" required class="w-full border p-3 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">시간</label>
                        <input type="time" id="web-time" required class="w-full border p-3 rounded">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-900 text-white font-bold py-4 rounded hover:bg-blue-800">
                    예약 신청하기
                </button>
            </form>
        </section>

    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스트레칭온 | 통합 회원관리 ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- CryptoJS for Solapi Kakao Alimtalk -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    body { font-family: "Pretendard", sans-serif; background-color: #f1f5f9; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="text-slate-800 h-screen flex overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 bg-[#0C3559] text-white flex flex-col justify-between shadow-xl z-20">
    <div>
      <div class="h-20 flex items-center gap-3 px-6 border-b border-white/10 cursor-pointer" onclick="window.showWelcomeView()">
        <!-- SVG Logo -->
        <svg class="h-8 w-auto text-amber-300" viewBox="0 0 130 110" fill="none">
          <path d="M 62 20 C 85 20, 105 38, 105 62 C 105 85, 85 102, 60 102 C 38 102, 22 86, 24 66" stroke="currentColor" stroke-width="14" stroke-linecap="round" fill="none" />
          <circle cx="46" cy="18" r="9" fill="currentColor" />
          <path d="M 2 38 C 18 37, 34 33, 50 28" stroke="currentColor" stroke-width="11" stroke-linecap="round" fill="none" />
          <path d="M 52 26 C 50 45, 38 72, 12 106 L 20 108 C 45 75, 58 48, 58 26 Z" fill="currentColor" />
          <path d="M 50 30 L 76 4 L 82 26 Z" fill="currentColor" />
        </svg>
        <div>
          <h1 class="font-bold text-lg tracking-tight">스트레칭온 ERP</h1>
          <p class="text-[10px] text-sky-300 font-semibold">Stretching ON Admin</p>
        </div>
      </div>
      
      <nav class="p-4 space-y-1">
        <button onclick="window.switchTab('dashboard')" id="btn-dashboard" class="w-full text-left px-4 py-3 rounded-xl font-bold flex items-center gap-3 text-white/70 hover:bg-white/10 hover:text-white transition-all tab-btn active:bg-sky-500 active:text-white">
          <span>📊</span> 대시보드
        </button>
        <button onclick="window.switchTab('members')" id="btn-members" class="w-full text-left px-4 py-3 rounded-xl font-bold flex items-center gap-3 text-white/70 hover:bg-white/10 hover:text-white transition-all tab-btn">
          <span>👥</span> 회원 관리
        </button>
        <button onclick="window.switchTab('reservations')" id="btn-reservations" class="w-full text-left px-4 py-3 rounded-xl font-bold flex items-center gap-3 text-white/70 hover:bg-white/10 hover:text-white transition-all tab-btn">
          <span>📅</span> 예약 관리
        </button>
      </nav>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col bg-slate-50 relative h-full overflow-hidden">
    
    <!-- Header -->
    <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0 shadow-sm z-10">
      <h2 id="header-title" class="text-xl font-bold text-slate-800 flex items-center gap-2">
        📊 대시보드
      </h2>
      <div class="flex items-center gap-4">
        <span class="text-xs font-bold px-3 py-1.5 bg-emerald-100 text-emerald-700 rounded-full flex items-center gap-1.5 shadow-inner">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 중앙 클라우드 연동중
        </span>
        <button onclick="window.openManualBookingModal()" class="px-5 py-2.5 bg-[#0C3559] hover:bg-[#082239] text-white rounded-xl text-sm font-bold shadow-md transition-all flex items-center gap-2">
          📞 전화 예약 등록
        </button>
      </div>
    </header>

    <!-- Scrollable Content Area -->
    <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
      
      <!-- Welcome View -->
      <div id="welcome-view" class="h-full flex flex-col items-center justify-center text-center space-y-6">
        <svg class="h-32 w-auto text-amber-300 drop-shadow-xl" viewBox="0 0 130 110" fill="none">
          <path d="M 62 20 C 85 20, 105 38, 105 62 C 105 85, 85 102, 60 102 C 38 102, 22 86, 24 66" stroke="currentColor" stroke-width="14" stroke-linecap="round" fill="none" />
          <circle cx="46" cy="18" r="9" fill="currentColor" />
          <path d="M 2 38 C 18 37, 34 33, 50 28" stroke="currentColor" stroke-width="11" stroke-linecap="round" fill="none" />
          <path d="M 52 26 C 50 45, 38 72, 12 106 L 20 108 C 45 75, 58 48, 58 26 Z" fill="currentColor" />
          <path d="M 50 30 L 76 4 L 82 26 Z" fill="currentColor" />
        </svg>
        <div>
          <h2 class="text-3xl font-extrabold text-[#0C3559] mb-2">원장님, 환영합니다!</h2>
          <p class="text-slate-500 font-medium">홈페이지 온라인 예약 및 회원 정보가 100% 실시간 연동됩니다.</p>
        </div>
      </div>

      <!-- Dashboard Tab -->
      <div id="tab-dashboard" class="tab-content">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <p class="text-sm font-bold text-slate-500 mb-1">오늘 예약 (홈페이지+전화)</p>
            <p class="text-3xl font-extrabold text-[#0C3559]"><span id="dash-today-bookings">0</span>건</p>
          </div>
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <p class="text-sm font-bold text-slate-500 mb-1">활성 수강 회원</p>
            <p class="text-3xl font-extrabold text-[#0092B8]"><span id="dash-active-members">0</span>명</p>
          </div>
        </div>
      </div>

      <!-- Members Tab -->
      <div id="tab-members" class="tab-content">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-lg font-bold text-slate-800">전체 회원 목록</h3>
          <button onclick="window.openMemberModal()" class="px-5 py-2 bg-[#0092B8] hover:bg-[#007a99] text-white font-bold text-sm rounded-xl shadow-md transition-all">
            + 신규 회원 등록
          </button>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
              <tr>
                <th class="px-6 py-4">이름</th>
                <th class="px-6 py-4">연락처</th>
                <th class="px-6 py-4">잔여 횟수</th>
                <th class="px-6 py-4">관리</th>
              </tr>
            </thead>
            <tbody id="member-table-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

      <!-- Reservations Tab -->
      <div id="tab-reservations" class="tab-content">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-lg font-bold text-slate-800">통합 예약 관리 (홈페이지 & 수기)</h3>
          <button onclick="window.openManualBookingModal()" class="px-5 py-2 bg-[#0092B8] text-white font-bold text-sm rounded-xl shadow-md">
            + 예약 등록
          </button>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
              <tr>
                <th class="px-6 py-4">예약일시</th>
                <th class="px-6 py-4">고객명</th>
                <th class="px-6 py-4">코스명</th>
                <th class="px-6 py-4">접수경로</th>
                <th class="px-6 py-4">상태</th>
                <th class="px-6 py-4">관리</th>
              </tr>
            </thead>
            <tbody id="booking-table-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Manual Booking Modal -->
  <div id="modal-manual-booking" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h3 class="text-lg font-bold text-slate-800">📞 수기 예약 등록</h3>
        <button onclick="window.closeModal('modal-manual-booking')" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
      </div>
      
      <div class="p-6 overflow-y-auto space-y-5 custom-scrollbar">
        <!-- Customer Info -->
        <div class="space-y-3">
          <label class="block text-xs font-bold text-slate-500 uppercase">예약자 정보</label>
          <input type="text" id="manual-name" placeholder="고객 성함" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm font-medium focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none" />
          <input type="tel" id="manual-phone" placeholder="연락처 (- 없이 입력)" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm font-medium focus:border-sky-500 outline-none" />
        </div>

        <!-- Schedule -->
        <div class="space-y-3">
          <label class="block text-xs font-bold text-slate-500 uppercase">일정 및 코스 (선택 시 온라인 즉시 마감됨)</label>
          <div class="grid grid-cols-2 gap-3">
            <input type="date" id="manual-date" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm font-medium outline-none" />
            <select id="manual-time" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm font-medium outline-none bg-white">
              <option value="10:00">10:00</option>
              <option value="11:00">11:00</option>
              <option value="12:00">12:00</option>
              <option value="14:00">14:00</option>
              <option value="15:00">15:00</option>
              <option value="16:00">16:00</option>
              <option value="17:00">17:00</option>
              <option value="18:00">18:00</option>
              <option value="19:00">19:00</option>
              <option value="20:00">20:00</option>
              <option value="21:00">21:00</option>
            </select>
          </div>
          <select id="manual-program" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm font-medium outline-none bg-white">
            <option value="Sol-Recovery (50분)">Sol-Recovery (50분)</option>
            <option value="Sol-Balance (90분)">Sol-Balance (90분)</option>
            <option value="솔루션 멤버십 10회">솔루션 멤버십 10회 차감 예약</option>
          </select>
        </div>

        <!-- Kakao Alimtalk Option -->
        <div class="p-4 bg-sky-50 rounded-xl border border-sky-100 mt-2">
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" id="manual-send-kakao" checked class="w-5 h-5 rounded border-sky-300 text-[#0092B8] focus:ring-[#0092B8]" />
            <div>
              <p class="text-sm font-bold text-[#0C3559]">📱 카카오 알림톡 자동 발송</p>
              <p class="text-xs text-sky-700 mt-0.5">예약 확정 시 고객 휴대폰으로 공식 알림톡 전송</p>
            </div>
          </label>
        </div>
      </div>
      
      <div class="p-6 border-t border-slate-100 bg-slate-50 flex gap-3">
        <button onclick="window.closeModal('modal-manual-booking')" class="flex-1 py-3.5 bg-white border border-slate-200 text-slate-600 rounded-xl text-sm font-bold hover:bg-slate-50">취소</button>
        <button onclick="window.submitManualBooking()" class="flex-1 py-3.5 bg-[#0C3559] text-white rounded-xl text-sm font-bold shadow-md hover:bg-[#082239]">예약 확정 및 전송 ✓</button>
      </div>
    </div>
  </div>

  <!-- Member Registration Modal -->
  <div id="modal-member" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm shadow-2xl overflow-hidden flex flex-col">
      <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h3 class="text-lg font-bold text-slate-800">👥 회원 등록</h3>
        <button onclick="window.closeModal('modal-member')" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
      </div>
      <div class="p-6 space-y-4">
        <input type="text" id="member-name" placeholder="이름" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm font-medium" />
        <input type="tel" id="member-phone" placeholder="연락처 (- 없이)" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm font-medium" />
        <input type="number" id="member-passes" placeholder="수강 횟수 (예: 10)" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm font-medium" />
      </div>
      <div class="p-6 border-t border-slate-100 bg-slate-50 flex gap-3">
        <button onclick="window.closeModal('modal-member')" class="flex-1 py-3 bg-white border border-slate-200 text-slate-600 rounded-xl text-sm font-bold">취소</button>
        <button onclick="window.saveMember()" class="flex-1 py-3 bg-[#0C3559] text-white rounded-xl text-sm font-bold">저장 ✓</button>
      </div>
    </div>
  </div>

  <!-- Javascript Logic (Standard) -->
  <script>
    window.bookings = [];
    window.members = [];

    window.showWelcomeView = function() {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('bg-sky-500', 'text-white'));
      document.getElementById('welcome-view').classList.remove('hidden');
      document.getElementById('header-title').innerHTML = `📊 대시보드`;
    };

    window.switchTab = function(tabId) {
      document.getElementById('welcome-view').classList.add('hidden');
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('bg-sky-500', 'text-white'));
      document.getElementById('btn-' + tabId).classList.add('bg-sky-500', 'text-white');
      
      const titles = { 'dashboard': '📊 대시보드', 'members': '👥 통합 회원 관리', 'reservations': '📅 통합 예약 관리' };
      document.getElementById('header-title').innerHTML = titles[tabId];

      if(tabId === 'dashboard') window.renderDashboard();
      if(tabId === 'members') window.renderMemberList();
      if(tabId === 'reservations') window.renderBookingList();
    };

    window.openModal = function(id) { document.getElementById(id).classList.remove('hidden'); };
    window.closeModal = function(id) { document.getElementById(id).classList.add('hidden'); };

    window.renderDashboard = function() {
      const today = new Date().toISOString().split('T')[0];
      const todayCount = window.bookings.filter(b => b.date === today && b.status !== '취소').length;
      const activeCount = window.members.filter(m => {
        let passes = m.remainingPasses !== undefined ? m.remainingPasses : m.passCount;
        return passes > 0;
      }).length;

      document.getElementById('dash-today-bookings').innerText = todayCount;
      document.getElementById('dash-active-members').innerText = activeCount;
    };

    window.renderMemberList = function() {
      const tbody = document.getElementById('member-table-body');
      tbody.innerHTML = window.members.map(m => {
        let passes = m.remainingPasses !== undefined ? m.remainingPasses : m.passCount;
        return `
        <tr class="hover:bg-slate-50 transition-colors border-b border-slate-100">
          <td class="px-6 py-4 font-bold text-[#0C3559]">${m.name}</td>
          <td class="px-6 py-4 text-slate-500 font-mono">${m.phone}</td>
          <td class="px-6 py-4">
            <span class="px-3 py-1 bg-sky-100 text-[#0092B8] font-bold rounded-full text-xs">잔여 ${passes}회</span>
          </td>
          <td class="px-6 py-4">
            <button onclick="window.deleteMember('${m.id}')" class="text-xs text-rose-500 font-bold hover:underline">삭제</button>
          </td>
        </tr>
      `}).join('');
    };

    window.openMemberModal = function() {
      document.getElementById('member-name').value = '';
      document.getElementById('member-phone').value = '';
      document.getElementById('member-passes').value = '10';
      window.openModal('modal-member');
    };

    window.saveMember = function() {
      const name = document.getElementById('member-name').value;
      const phone = document.getElementById('member-phone').value.replace(/[^0-9]/g, '');
      const passes = parseInt(document.getElementById('member-passes').value || '10');

      if(!name || !phone) return alert('이름과 연락처를 입력해주세요.');

      const newMember = {
        id: 'M-' + Date.now(),
        name, phone,
        remainingPasses: passes,
        totalPasses: passes
      };

      // 클라우드 동기화 
      if (typeof window.syncMemberToCloud === 'function') {
        window.syncMemberToCloud(newMember);
      }
      
      window.closeModal('modal-member');
    };

    window.deleteMember = function(id) {
      if(confirm('이 회원을 삭제하시겠습니까? 데이터가 홈페이지에서도 연동 삭제됩니다.')) {
        if (typeof window.deleteMemberFromCloud === 'function') {
          window.deleteMemberFromCloud(id);
        }
      }
    };

    window.renderBookingList = function() {
      // 날짜/시간 순 정렬 (가까운 예약순)
      const sorted = [...window.bookings].sort((a, b) => {
        return new Date(b.date + 'T' + b.time) - new Date(a.date + 'T' + a.time);
      });

      const tbody = document.getElementById('booking-table-body');
      tbody.innerHTML = sorted.map(b => {
        const isERP = b.id.startsWith('ERP');
        return `
        <tr class="hover:bg-slate-50 transition-colors border-b border-slate-100">
          <td class="px-6 py-4 font-semibold text-slate-600">${b.date} ${b.time}</td>
          <td class="px-6 py-4 font-bold text-[#0C3559]">${b.name} <span class="text-[10px] text-slate-400 font-mono ml-1">${b.phone.slice(-4)}</span></td>
          <td class="px-6 py-4 text-xs font-semibold text-slate-500">${b.programTitle}</td>
          <td class="px-6 py-4">
            <span class="px-2 py-1 rounded text-[10px] font-bold ${isERP ? 'bg-amber-100 text-amber-700' : 'bg-[#0C3559]/10 text-[#0C3559]'}">${isERP ? '전화(수기)' : '홈페이지'}</span>
          </td>
          <td class="px-6 py-4">
            <span class="px-2 py-1 rounded-md text-[10px] font-bold ${b.status === '취소' ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-700'}">${b.status}</span>
          </td>
          <td class="px-6 py-4">
            ${b.status !== '취소' ? `<button onclick="window.cancelBooking('${b.id}')" class="text-xs text-rose-500 font-bold hover:underline">취소처리</button>` : ''}
          </td>
        </tr>
      `}).join('');
    };

    window.openManualBookingModal = function() {
      document.getElementById('manual-date').value = new Date().toISOString().split('T')[0];
      window.openModal('modal-manual-booking');
    };

    window.cancelBooking = function(id) {
      if(confirm('이 예약을 취소 처리하시겠습니까? 해당 시간대가 즉시 다시 오픈됩니다.')) {
        const b = window.bookings.find(x => x.id === id);
        if(b) {
          b.status = '취소';
          // 클라우드 상태 변경 반영
          if (typeof window.syncBookingToCloud === 'function') {
            window.syncBookingToCloud(b);
          }
        }
      }
    };

    // 카카오 알림톡 연동 모듈 호출
    window.sendKakaoAlimtalk = async function({ name, phone, programTitle, date, time }) {
      try {
        const cleanPhone = phone.replace(/[^0-9]/g, '');
        // 홈페이지 백엔드 서버 경유 발송
        await fetch('https://solutionstretching.com/api/send-alimtalk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone: cleanPhone, programTitle, duration: "50", date, time })
        });
      } catch (err) {
        console.error("알림톡 발송 에러:", err);
      }
    };

    window.submitManualBooking = async function() {
      const name = document.getElementById('manual-name').value.trim();
      const phone = document.getElementById('manual-phone').value.trim().replace(/[^0-9]/g, '');
      const date = document.getElementById('manual-date').value;
      const time = document.getElementById('manual-time').value;
      const programTitle = document.getElementById('manual-program').value;
      const sendKakao = document.getElementById('manual-send-kakao').checked;

      if(!name || !phone || !date) return alert('예약자 정보를 모두 입력해주세요.');

      // 중복 시간대 체크 (홈페이지 데이터 포함)
      const isDuplicate = window.bookings.some(b => b.date === date && b.time === time && b.status !== '취소');
      if (isDuplicate) {
        return alert('🚨 이미 예약이 확정(마감)된 시간대입니다. (홈페이지 또는 다른 경로로 예약됨)');
      }

      const newBooking = {
        id: 'ERP-' + Date.now(),
        name, phone, date, time, programTitle,
        status: '예약 확정'
      };

      // ☁️ 1. 클라우드에 예약 전송 (홈페이지 달력 즉각 차단)
      if (typeof window.syncBookingToCloud === 'function') {
        window.syncBookingToCloud(newBooking);
      } else {
        window.bookings.unshift(newBooking);
        window.renderBookingList();
      }

      // 📱 2. 카카오 알림톡 전송
      if (sendKakao) {
        alert('예약이 클라우드에 확정되었으며 고객님께 카카오 알림톡이 전송됩니다.');
        await window.sendKakaoAlimtalk({ name, phone, programTitle, date, time });
      } else {
        alert('예약이 클라우드에 정상 반영 확정되었습니다.');
      }

      window.closeModal('modal-manual-booking');
    };

    window.onload = function() {
      window.showWelcomeView();
    };
  </script>

  <!-- ☁️ Firebase Cloud Firestore SDK (Real-time Sync module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, setDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCnwvnHMwwrQx3mAOVAimDn9mNbI9VsFeM",
      authDomain: "solutionstretching.firebaseapp.com",
      projectId: "solutionstretching",
      storageBucket: "solutionstretching.firebasestorage.app",
      messagingSenderId: "567579240099",
      appId: "1:567579240099:web:1b32c98d04fbd4e55d0116"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Bookings 실시간 감지 리스너 (홈페이지 예약 시 ERP 자동 업데이트)
      onSnapshot(collection(db, "bookings"), (snapshot) => {
        const cloudBookings = [];
        snapshot.forEach((docSnap) => cloudBookings.push(docSnap.data()));
        window.bookings = cloudBookings;
        
        if (document.getElementById('tab-reservations').classList.contains('active')) {
          window.renderBookingList();
        }
        if (document.getElementById('tab-dashboard').classList.contains('active')) {
          window.renderDashboard();
        }
      });

      // Members 실시간 감지 리스너
      onSnapshot(collection(db, "members"), (snapshot) => {
        const cloudMembers = [];
        snapshot.forEach((docSnap) => cloudMembers.push(docSnap.data()));
        window.members = cloudMembers;
        
        if (document.getElementById('tab-members').classList.contains('active')) {
          window.renderMemberList();
        }
        if (document.getElementById('tab-dashboard').classList.contains('active')) {
          window.renderDashboard();
        }
      });

      // 저장 및 삭제 공용 함수
      window.syncBookingToCloud = async function(bookingObj) {
        await setDoc(doc(db, "bookings", bookingObj.id), bookingObj);
      };
      
      window.syncMemberToCloud = async function(memberObj) {
        await setDoc(doc(db, "members", memberObj.id), memberObj);
      };

      window.deleteMemberFromCloud = async function(memberId) {
        await deleteDoc(doc(db, "members", memberId));
      };
      
      console.log("🔥 Firebase ERP Cloud Sync Connected.");
    } catch(err) {
      console.warn("Firebase Init Error:", err);
    }
  </script>
